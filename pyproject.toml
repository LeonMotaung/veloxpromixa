[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "velox-proxima"
version = "0.1.0"
description = "Velox Proxima (VP) — Declarative AI Language & Runtime System"
authors = [{ name = "Leon Motaung" }]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.optional-dependencies]
full = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.scripts]
vp = "vp:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["velox*"]
