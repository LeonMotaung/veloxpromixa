services:
  - type: web
    name: velox-backend
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: API_KEY
        value: proxima-key-2026

  - type: web
    name: velox-dashboard
    env: static
    # Root directory for this service
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://velox-backend-8crj.onrender.com
      - key: NODE_VERSION
        value: 18.x
